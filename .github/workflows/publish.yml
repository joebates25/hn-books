name: Harvest and publish

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the top of the hour when Actions is busiest
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # push the database to the data branch
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # The database lives on an orphan `data` branch with a single commit, so history never grows.
      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:hn_books.sqlite > data/hn_books.sqlite
          fi
          hn-books stats

      - name: Harvest recent comments
        run: hn-books harvest --days 3

      - name: Save database
        env:
          TOKEN: ${{ github.token }}
        run: |
          hn-books stats
          tmp="$(mktemp -d)"
          cp data/hn_books.sqlite "$tmp/"
          cd "$tmp"
          git init -q -b data
          git add hn_books.sqlite
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Database snapshot $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Build site
        run: hn-books build-site --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

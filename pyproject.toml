[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hn-books"
version = "0.1.0"
description = "V0 Hacker News book-mention indexer: retailer URLs in comments → canonical books."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HN Books" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
parquet = ["duckdb>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
hn-books = "hn_books.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hn_books"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
